services:
  hlds:
    build:
      context: .
      args:
        - GAME=${GAME:-cstrike}
        - FLAG=${FLAG:-}
        - VERSION=${VERSION:-custom}
        - IMAGE=${IMAGE:-custom}
    volumes:
      - "./config:/temp/config"
      - "./mods:/temp/mods"
      - hlds_logs:/opt/steam/hlds/cstrike/logs
      - ./config/server.cfg:/opt/steam/hlds/cstrike/server.cfg:ro
      - ./config/maps:/opt/steam/hlds/cstrike/maps:ro
    ports:
      - "27015:27015/udp"
      - "27015:27015"
      - "26900:2690/udp"
    environment:
      - GAME=${GAME:-cstrike}
      - FLAG=${FLAG:-}
      - VERSION=${VERSION:-custom}
      - IMAGE=${IMAGE:-custom}
    command: +maxplayers 18 +log on +map cs_assault_upc +hostname "Sofa's 24/7 UPC"
    restart: unless-stopped

  psychostats_db:
    image: mariadb:10.3
    container_name: psychostats_db
    environment:
      # NOTE: Move these to a .env file for production
      - MARIADB_DATABASE=psychostats
      - MARIADB_USER=psychostats
      - MARIADB_PASSWORD=psychostats_pass
      - MARIADB_ROOT_PASSWORD=change_me_root
    volumes:
      - "./data/mysql:/var/lib/mysql"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  psychostats_web:
    build:
      context: .
      dockerfile: Dockerfile.psychostats_web
    container_name: psychostats_web
    depends_on:
      psychostats_db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      # Mount the full PsychoStats distribution so `root/`, `scripts/`, etc. are available
      # (the installer and runtime often reference these outside of `www/`).
      - "./psychostats:/opt/psychostats"
      - hlds_logs:/opt/steam/hlds/cstrike/logs
      # Apache document root serves the PsychoStats `www/` directory
      - "./psychostats/www:/var/www/html"
      - "./data/hlds_logs:/opt/hlds_logs:ro"
    restart: unless-stopped
  
  psychostats_parser:
    build:
      context: .
      dockerfile: Dockerfile.psychostats_parser
    container_name: psychostats_parser
    depends_on: 
      psychostats_db:
        condition: service_healthy
    volumes:
      - "./psychostats:/opt/psychostats"
      - "./data/hlds_logs:/opt/steam/hlds/cstrike/logs:ro"
      - "./cron.stats:/etc/cron.d/psychostats"
    command: ["cron", "-f"]
    restart: unless-stopped
volumes:
  hlds_logs: 
