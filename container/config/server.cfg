// Server settings
map cs_assault_upc;
hostname "Sofa's Eternal 24/7 Assault UPC";
sv_cheats "0"; // Disable cheating
sv_flood_delay "2";
sv_max_speed "125"; // Maximum player speed
sv_min_speed "300"; // Minimum player speed
sv_punkbuster "0"; // Disable PunkBuster
sv_region "0"; // Global server region
sv_timeout "120"; // Timeout in seconds for a player to reconnect
sv_allow_host_movement "0"; // Allow host movement
sv_allow_spectators "1"; // Allow spectators
sv_spec_rules_123 "1"; // Allow spectators to control their view

// Game settings
mp_friendly_fire "0"; // Disable friendly fire
mp_buy_time "2"; // How long players can buy weapons in seconds
mp_buy_max_money "16000"; // Maximum amount of money players can start with
mp_buyback_time "1.5"; // Time in seconds to buy back
mp_buyback_max_money "8000"; // Maximum amount of money players can buy back
mp_forcereload "1"; // Force players to reload weapons
mp_chaff_weapon_respawn "0"; // Allow chaff weapon respawn
mp_chaff_weapon_respawn_time "0"; // Allow chaff weapon respawn time
mp_chaff_grenade_respawn "0"; // Allow chaff grenade respawn
mp_chaff_grenade_respawn_time "0"; // Allow chaff grenade respawn time

// Map settings
mp_map_group "1"; // Map group ID
mp_map_rotate "0"; // Enable map rotation
mp_map_rotate_delay "60"; // Delay between map changes in seconds

// Player settings
mp_team_balance "1"; // Enable team balancing
mp_max_round_time "210"; // Maximum round time in seconds
mp_match_end_delay "8"; // Delay in seconds after the end of the match

// Other settings
cl_cmdrate "100";
cl_updaterate "66";
cl_lag "0";
cl_max_players "18"; // Maximum number of players on the server
cl_show_death_notification "1";

//  Commands
// "sv_max_unlagged_ticks 10" // Maximum ticks per second
// "sv_log_file 0" // disable logging
// "sv_log_no_console 1" // Disable logging to console

// --- Logging (required for PsychoStats) ---
log on
sv_logfile 1
mp_logfile 1
mp_logdetail 3
sv_logflush 1
