services:
  hlds:
    build:
      context: .
      target: hlds
      args:
        - GAME=${GAME:-cstrike}
        - FLAG=${FLAG:-}
        - VERSION=${VERSION:-custom}
        - IMAGE=${IMAGE:-custom}
    volumes:
      - "./config:/temp/config"
      - "./mods:/temp/mods"
      - ./config/server.cfg:/opt/steam/hlds/cstrike/cfg/server.cfg:ro
      - cs_logs:/opt/steam/hlds/cstrike/logs
    ports:
      - "27015:27015/udp"
      - "27015:27015"
      - "26900:26900/udp"
    environment:
      - GAME=${GAME:-cstrike}
      - FLAG=${FLAG:-}
      - VERSION=${VERSION:-custom}
      - IMAGE=${IMAGE:-custom}
    command: +maxplayers 18 +log on +map cs_assault_upc +hostname "Sofa's 24/7 UPC"
    restart: unless-stopped

  psychostats_db:
    image: mariadb:10.11
    container_name: psychostats_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${PS_DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${PS_DB_NAME:-psychostats3_1}
      MARIADB_USER: ${PS_DB_USER:-ps3}
      MARIADB_PASSWORD: ${PS_DB_PASSWORD:-ps3pass}
    volumes:
      - psychostats_db_data:/var/lib/mysql
      - ./psychostats/db/conf.d/disable-ssl.cnf:/etc/mysql/mariadb.conf.d/99-disable-ssl.cnf:ro
      - ./psychostats/db/initdb/01-disable-user-ssl.sql:/docker-entrypoint-initdb.d/01-disable-user-ssl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${PS_DB_ROOT_PASSWORD:-rootpass} --silent"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
    networks:
      default:
        aliases:
          - psychostats_db

  psychostats_web:
    build:
      context: .
      target: psychostats_web
    container_name: psychostats_web
    restart: unless-stopped
    depends_on:
      psychostats_db:
        condition: service_healthy
    ports:
      - "8088:80"
    # OPTIONAL: if you want to edit PsychoStats web files on the host, keep this bind mount.
    # If you want the container-baked files instead, comment this out.
    # NOTE: This bind mount overrides the image content. Ensure ./psychostats/www/config.php is updated
    # to use host "psychostats_db" (NOT localhost), or comment out the volumes block to use the baked files.
    volumes:
      - ./psychostats/www:/var/www/html
    environment:
      PS_DB_HOST: psychostats_db
      PS_DB_PORT: "3306"
      PS_DB_NAME: ${PS_DB_NAME:-psychostats3_1}
      PS_DB_USER: ${PS_DB_USER:-ps3}
      PS_DB_PASSWORD: ${PS_DB_PASSWORD:-ps3pass}
    entrypoint: ["/bin/sh", "-lc", "set -e; cat > /var/www/html/config.php <<'PHP'\n<?php\n// PsychoStats web configuration (DB connection + site URL)\n// Intentionally forces TCP connections inside Docker (no localhost / no socket)\n\n$dbtype = 'mysql';\n$dbhost = '${PS_DB_HOST:-psychostats_db}';   // Docker service name, NOT localhost\n$dbport = '${PS_DB_PORT:-3306}';             // Force TCP, avoids mysqld.sock\n$dbname = '${PS_DB_NAME:-psychostats3_1}';\n$dbuser = '${PS_DB_USER:-ps3}';\n$dbpass = '${PS_DB_PASSWORD:-ps3pass}';\n\n// Table prefix used during install\n$dbtblprefix = 'ps_';\n\n// Base URL used by PsychoStats\n$site_url = 'http://localhost:8088';\n?>\nPHP\nexec apache2 -D FOREGROUND" ]

  psychostats_parser:
    build:
      context: .
      target: psychostats_parser
    container_name: psychostats_parser
    restart: unless-stopped
    depends_on:
      psychostats_db:
        condition: service_healthy
      hlds:
        condition: service_started
    volumes:
      - ./psychostats:/opt/psychostats
      - cs_logs:/logs:ro
    working_dir: /opt/psychostats/root
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      set -eux;
      echo 'Starting psychostats_parser...';
      echo 'Waiting for MariaDB TCP...';
      until mysqladmin ping -h psychostats_db -uroot -p"${PS_DB_ROOT_PASSWORD:-rootpass}" --silent; do sleep 2; done;
      echo 'MariaDB is up. Waiting for ps3 credentials...';
      until mysql --protocol=TCP -h psychostats_db -P 3306 -u"${PS_DB_USER:-ps3}" -p"${PS_DB_PASSWORD:-ps3pass}" -e 'SELECT 1;' "${PS_DB_NAME:-psychostats3_1}" >/dev/null 2>&1; do sleep 2; done;
      echo 'DB login OK. Starting PsychoStats parser loop.';
      while true; do
        perl ./stats.pl -config ./stats.cfg -logsource /logs -gametype halflife -modtype cstrike || true;
        sleep 30;
      done
    environment:
      PS_DB_HOST: psychostats_db
      PS_DB_PORT: "3306"
      PS_DB_NAME: ${PS_DB_NAME:-psychostats3_1}
      PS_DB_USER: ${PS_DB_USER:-ps3}
      PS_DB_PASSWORD: ${PS_DB_PASSWORD:-ps3pass}

volumes:
  cs_logs:
  psychostats_db_data: