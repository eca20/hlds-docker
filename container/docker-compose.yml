services:
  hlds:
    build:
      context: .
      args:
        - GAME=${GAME}
        - FLAG=${FLAG}
        - VERSION=${VERSION}
        - IMAGE=${IMAGE}
    volumes:
      - "./config:/temp/config"
      - "./mods:/temp/mods"
      - "./data:/opt/steam/hlds"
    ports:
      - "27015:27015/udp"
      - "27015:27015"
      - "26900:26900/udp"
    environment:
      - GAME=${GAME}
      - FLAG=${FLAG}
      - VERSION=${VERSION}
      - IMAGE=${IMAGE}
    command: +maxplayers 18 +log on +rcon_password "changeme" +map cs_assault_upc
