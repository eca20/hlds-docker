services:
  hlds:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GAME=${GAME:-cstrike}
        - FLAG=${FLAG:-}
        - VERSION=${VERSION:-custom}
        - IMAGE=${IMAGE:-custom}

    # IMPORTANT:
    # If you bind-mount logs from the host, permissions come from the host.
    # Running as root avoids "Unable to open logfiles..." due to host dir perms.
    # (If you'd rather run as steam, we should patch entrypoint.sh to fix perms then drop privileges.)
    user: "0:0"

    volumes:
      - "./config:/temp/config"
      - "./mods:/temp/mods"

      # Host bind mount for logs (permissions controlled by host FS)
      - "./data/hlds_logs:/opt/steam/hlds/cstrike/logs"

      # Your server.cfg overrides anything installed by SteamCMD
      - "./config/server.cfg:/opt/steam/hlds/cstrike/cfg/server.cfg:ro"

    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
      - "26900:2690/udp"

    environment:
      - GAME=${GAME:-cstrike}
      - FLAG=${FLAG:-}
      - VERSION=${VERSION:-custom}
      - IMAGE=${IMAGE:-custom}

    command: +maxplayers 18 +log on +map cs_assault_upc +hostname "Sofa's 24/7 UPC"
    restart: unless-stopped


  psychostats_db:
    image: mariadb:10.3
    container_name: psychostats_db
    environment:
      - MARIADB_DATABASE=psychostats
      - MARIADB_USER=psychostats
      - MARIADB_PASSWORD=psychostats_pass
      - MARIADB_ROOT_PASSWORD=change_me_root
    volumes:
      - "./data/mysql:/var/lib/mysql"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped


  psychostats_web:
    build:
      context: .
      dockerfile: Dockerfile.psychostats_web
    container_name: psychostats_web
    depends_on:
      psychostats_db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      # Full PsychoStats distribution available in-container
      - "./psychostats:/opt/psychostats"

      # Apache docroot serves the web UI
      - "./psychostats/www:/var/www/html"
    restart: unless-stopped