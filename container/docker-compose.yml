services:
  hlds:
    build:
      context: .
      target: hlds
      args:
        - GAME=${GAME:-cstrike}
        - FLAG=${FLAG:-}
        - VERSION=${VERSION:-custom}
        - IMAGE=${IMAGE:-custom}
    volumes:
      - "./config:/temp/config"
      - "./mods:/temp/mods"
      - ./config/server.cfg:/opt/steam/hlds/cstrike/cfg/server.cfg:ro
      - cs_logs:/opt/steam/hlds/cstrike/logs
    ports:
      - "27015:27015/udp"
      - "27015:27015"
      - "26900:26900/udp"
    environment:
      - GAME=${GAME:-cstrike}
      - FLAG=${FLAG:-}
      - VERSION=${VERSION:-custom}
      - IMAGE=${IMAGE:-custom}
    command: +maxplayers 18 +log on +map cs_assault_upc +hostname "Sofa's 24/7 UPC"
    restart: unless-stopped

  psychostats_db:
    image: mariadb:10.11
    container_name: psychostats_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${PS_DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${PS_DB_NAME:-psychostats3_1}
      MARIADB_USER: ${PS_DB_USER:-ps3}
      MARIADB_PASSWORD: ${PS_DB_PASSWORD:-ps3pass}
    volumes:
      - psychostats_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${PS_DB_USER:-ps3} -p${PS_DB_PASSWORD:-ps3pass} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases:
          - psychostats_db

  psychostats_web:
    build:
      context: .
      target: psychostats_web
    container_name: psychostats_web
    restart: unless-stopped
    depends_on:
      psychostats_db:
        condition: service_healthy
    ports:
      - "8088:80"
    # OPTIONAL: if you want to edit PsychoStats web files on the host, keep this bind mount.
    # If you want the container-baked files instead, comment this out.
    # NOTE: This bind mount overrides the image content. Ensure ./psychostats/www/config.php is updated
    # to use host "psychostats_db" (NOT localhost), or comment out the volumes block to use the baked files.
    volumes:
      - ./psychostats/www:/var/www/html
    environment:
      PS_DB_HOST: psychostats_db
      PS_DB_PORT: "3306"
      PS_DB_NAME: ${PS_DB_NAME:-psychostats3_1}
      PS_DB_USER: ${PS_DB_USER:-ps3}
      PS_DB_PASSWORD: ${PS_DB_PASSWORD:-ps3pass}

  psychostats_parser:
    build:
      context: .
      target: psychostats_parser
    container_name: psychostats_parser
    restart: unless-stopped
    depends_on:
      psychostats_db:
        condition: service_healthy
      hlds:
        condition: service_started
    volumes:
      - ./psychostats/root:/opt/psychostats
      - cs_logs:/logs:ro
    working_dir: /opt/psychostats
    environment:
      PS_DB_HOST: psychostats_db
      PS_DB_PORT: "3306"
      PS_DB_NAME: ${PS_DB_NAME:-psychostats3_1}
      PS_DB_USER: ${PS_DB_USER:-ps3}
      PS_DB_PASSWORD: ${PS_DB_PASSWORD:-ps3pass}
    command: >
      sh -lc "
        echo 'Waiting for MariaDB at psychostats_db:3306...';
        until mysqladmin ping -h psychostats_db -u${PS_DB_USER:-ps3} -p${PS_DB_PASSWORD:-ps3pass} --silent; do
          sleep 2;
        done;
        echo 'MariaDB is up. Starting PsychoStats parser loop.';
        while true; do
          perl /opt/psychostats/stats.pl -config /opt/psychostats/stats.cfg -logsource /logs -gametype halflife -modtype cstrike || true;
          sleep 30;
        done
      "

volumes:
  cs_logs:
  psychostats_db_data: